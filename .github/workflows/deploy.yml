name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mia-llm-research/website/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mia-llm-research/website/package-lock.json

      - name: Install dependencies
        working-directory: mia-llm-research/website
        run: npm ci

      - name: Build
        working-directory: mia-llm-research/website
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mia-llm-research/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
